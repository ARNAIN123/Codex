<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Buscador automático de motos</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0b1020;
      --card: #141a2e;
      --accent: #5ad1ff;
      --muted: #97a3c4;
      --text: #e9eefc;
      --chip: #1f2742;
    }

    body {
      margin: 0;
      font-family: "Inter", "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(150deg, #0a0f1d 0%, #0b1020 35%, #121c3a 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
    }

    .app {
      width: min(980px, 100%);
      background: rgba(20, 26, 46, 0.9);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
    }

    header {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    h1 {
      font-size: clamp(1.8rem, 2vw + 1rem, 2.6rem);
      margin: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .search-box {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      margin-top: 12px;
    }

    input[type="search"] {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid rgba(90, 209, 255, 0.25);
      background: #0e1426;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border 0.2s ease, box-shadow 0.2s ease;
    }

    input[type="search"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(90, 209, 255, 0.15);
    }

    .badge {
      padding: 12px 16px;
      border-radius: 999px;
      border: 1px solid rgba(90, 209, 255, 0.3);
      color: var(--accent);
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(90, 209, 255, 0.08);
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }

    .chip {
      background: var(--chip);
      color: var(--muted);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.85rem;
    }

    .results {
      margin-top: 28px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }

    .card {
      background: #11182d;
      border-radius: 16px;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      display: grid;
      gap: 10px;
      min-height: 160px;
    }

    .card h3 {
      margin: 0;
      font-size: 1.1rem;
    }

    .card span {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .price {
      font-weight: 700;
      color: #f9d56e;
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 32px;
      background: rgba(14, 20, 38, 0.6);
      border-radius: 16px;
      border: 1px dashed rgba(90, 209, 255, 0.2);
    }

    @media (max-width: 700px) {
      .search-box {
        grid-template-columns: 1fr;
      }

      .badge {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>Motor de búsqueda automático para motos</h1>
      <p>
        Escribe cualquier marca, modelo o tipo de moto. Los resultados se actualizan
        al instante gracias al filtro en tiempo real.
      </p>
      <div class="search-box">
        <input
          type="search"
          id="searchInput"
          placeholder="Buscar: cafe racer, Yamaha, trail, eléctrica..."
          autocomplete="off"
        />
        <div class="badge" id="resultBadge">10 resultados</div>
      </div>
      <div class="filters" id="activeFilters"></div>
    </header>

    <section class="results" id="results"></section>
  </main>

  <script>
    const motos = [
      {
        marca: "Yamaha",
        modelo: "MT-07",
        tipo: "Naked",
        cilindraje: "689 cc",
        precio: "$8,399",
        motor: "Bicilíndrico",
      },
      {
        marca: "Honda",
        modelo: "CBR 500R",
        tipo: "Deportiva",
        cilindraje: "471 cc",
        precio: "$7,499",
        motor: "Bicilíndrico",
      },
      {
        marca: "KTM",
        modelo: "390 Adventure",
        tipo: "Trail",
        cilindraje: "373 cc",
        precio: "$7,299",
        motor: "Monocilíndrico",
      },
      {
        marca: "BMW",
        modelo: "R nineT",
        tipo: "Café racer",
        cilindraje: "1,170 cc",
        precio: "$16,995",
        motor: "Bóxer",
      },
      {
        marca: "Ducati",
        modelo: "Scrambler Icon",
        tipo: "Scrambler",
        cilindraje: "803 cc",
        precio: "$11,495",
        motor: "Bicilíndrico",
      },
      {
        marca: "Suzuki",
        modelo: "V-Strom 650",
        tipo: "Adventure",
        cilindraje: "645 cc",
        precio: "$9,099",
        motor: "Bicilíndrico",
      },
      {
        marca: "Royal Enfield",
        modelo: "Himalayan",
        tipo: "Trail",
        cilindraje: "411 cc",
        precio: "$5,899",
        motor: "Monocilíndrico",
      },
      {
        marca: "Zero",
        modelo: "SR/F",
        tipo: "Eléctrica",
        cilindraje: "110 kW",
        precio: "$19,995",
        motor: "Eléctrico",
      },
      {
        marca: "Harley-Davidson",
        modelo: "Iron 883",
        tipo: "Custom",
        cilindraje: "883 cc",
        precio: "$10,999",
        motor: "V-Twin",
      },
      {
        marca: "Aprilia",
        modelo: "RS 660",
        tipo: "Deportiva",
        cilindraje: "659 cc",
        precio: "$11,299",
        motor: "Bicilíndrico",
      },
    ];

    const searchInput = document.getElementById("searchInput");
    const results = document.getElementById("results");
    const resultBadge = document.getElementById("resultBadge");
    const activeFilters = document.getElementById("activeFilters");

    const renderResults = (items) => {
      results.innerHTML = "";

      if (items.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.innerHTML =
          "<strong>No encontramos coincidencias.</strong><br/>Prueba con otra marca o estilo.";
        results.appendChild(empty);
        resultBadge.textContent = "0 resultados";
        return;
      }

      resultBadge.textContent = `${items.length} resultados`;

      items.forEach((moto) => {
        const card = document.createElement("article");
        card.className = "card";
        card.innerHTML = `
          <h3>${moto.marca} ${moto.modelo}</h3>
          <span>Tipo: ${moto.tipo}</span>
          <span>Motor: ${moto.motor}</span>
          <span>Cilindraje: ${moto.cilindraje}</span>
          <span class="price">${moto.precio}</span>
        `;
        results.appendChild(card);
      });
    };

    const updateFilters = (query) => {
      activeFilters.innerHTML = "";
      if (!query) {
        const chip = document.createElement("span");
        chip.className = "chip";
        chip.textContent = "Mostrando catálogo completo";
        activeFilters.appendChild(chip);
        return;
      }

      query.split(" ").forEach((term) => {
        if (!term) return;
        const chip = document.createElement("span");
        chip.className = "chip";
        chip.textContent = `Filtro: ${term}`;
        activeFilters.appendChild(chip);
      });
    };

    const filterMotos = (value) => {
      const query = value.trim().toLowerCase();
      updateFilters(query);

      const filtered = motos.filter((moto) => {
        const haystack = `${moto.marca} ${moto.modelo} ${moto.tipo} ${moto.cilindraje} ${moto.motor}`.toLowerCase();
        return query.split(" ").every((term) => haystack.includes(term));
      });

      renderResults(filtered);
    };

    searchInput.addEventListener("input", (event) => {
      filterMotos(event.target.value);
    });

    filterMotos("");
  </script>
</body>
</html>
